apiVersion: apps/v1                    
kind: Deployment                        
metadata:                               
  name: background-threatanalyzer       
  labels:                               
    app: background-threatanalyzer      
spec:                                   
  replicas: 1                           
  selector:                             
    matchLabels:                        
      app: background-threatanalyzer    
  template:                             
    metadata:                           
      labels:                           
        app: background-threatanalyzer  
    spec:                               
      containers:                       
        - name: background-threatanalyzer 
          image: zeeshan8145/background-threatanalyzer:latest       
          env:                          
            - name: MONGO_URL           
              value: mongodb://mongodb:27017 # Connects the worker to databse
            - name: POLL_INTERVAL        
              value: "2"                # Requests a two second polling interval. check main.py for init script
            - name: MAX_ATTEMPTS         .
              value: "3"                # Allows up to three attempts check main.py for init script
            - name: LEASE_SECONDS       
              value: "100"               # Requests a 100 second lease , check main.py for init script
            - name: WORKER_ID            
              value: kubernetes-worker  # Gives the worker a recognizable iD

---

apiVersion: v1                          
kind: Service                           
metadata:                               
  name: threat-frontend                 
  labels:                              
    app: threat-frontend                
spec:                                   
  type: LoadBalancer                    
  ports:                                
    - name: http                        
      port: 8000                        
      targetPort: http                  
      protocol: TCP                     
  selector:                            
    app: threat-frontend                

---

apiVersion: apps/v1                    
kind: Deployment                        
metadata:                               
  name: threat-frontend                 
  labels:                               
    app: threat-frontend                
spec:                                   
  replicas: 1                           
  selector:                             
    matchLabels:                        
      app: threat-frontend              
  template:                             
    metadata:                           
      labels:                           
        app: threat-frontend            
    spec:                               
      containers:                       
        - name: threat-frontend         
          image: zeeshan8145/threat-frontend:latest          
          ports:                        
            - name: http               
              containerPort: 8000       
          env:                          
            - name: LOOKUP_SERVICE_URL  
              value: http://internal-attack-lookup:8000 
            - name: CVE_SERVICE_URL     
              value: http://cve-lookup:8000 

